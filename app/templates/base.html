<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acortador de URLs</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0 0 4px; } .sub { color: #94a3b8; margin: 0 0 24px; }
    form { display: grid; gap: 10px; background: #1e293b; padding: 20px; border-radius: 14px; }
    input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: inherit; font-size: 1rem; }
    button { padding: 12px; border: none; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .ok, .err { padding: 12px; border-radius: 8px; margin: 16px 0; word-break: break-all; }
    .ok { background: #14532d; } .err { background: #7f1d1d; }
    a { color: #4ade80; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: .9rem; }
    td, th { padding: 8px; border-bottom: 1px solid #334155; text-align: left; }
    td.url { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer { color: #64748b; font-size: .8rem; margin-top: 32px; text-align: center; }
  </style>
</head>
<body><main>{% block contenido %}{% endblock %}
<footer>Desarrollado por Alfredo Cruz · Flask + SQLite + Docker</footer></main></body>
</html>
